
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>독서 활동 기록장</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background-color: #f3f5f9;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 35px;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
            color: #263b70;
        }

        .description {
            margin-bottom: 30px;
            text-align: center;
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #526fca;
        }

        /* 글자 수 표시 */
        .char-counter {
            margin-top: 8px;
            text-align: right;
            color: #777;
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background-color: #405bb5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #304890;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 12px;
            }

            .container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>독서 활동 기록장</h1>

        <p class="description">
            오늘 읽은 책과 나의 감상을 기록해 보세요.
        </p>

        <form
            id="readingForm"
            method="POST"
            action="https://script.google.com/macros/s/AKfycbwEdw3UYk0hdLKF4arXu65vAzqNv65FEh9BUcmEGgZdFExih1RJRZd9DzV7tffwViVS/exec"
            novalidate
        >

            <div class="form-group">
                <label for="bookTitle">책 제목</label>
                <input
                    type="text"
                    id="bookTitle"
                    name="bookTitle"
                >
            </div>

            <div class="form-group">
                <label for="readingMinutes">독서 시간(분)</label>
                <input
                    type="number"
                    id="readingMinutes"
                    name="readingMinutes"
                    min="1"
                    max="180"
                    step="1"
                >
            </div>

            <div class="form-group">
                <label for="review">한 줄 감상</label>
                <textarea
                    id="review"
                    name="review"
                    rows="5"
                    maxlength="100"
                ></textarea>

                <!-- 실시간 글자 수 표시 -->
                <div class="char-counter" id="reviewCount">
                    0 / 100
                </div>
            </div>

            <button type="submit">기록 저장</button>

        </form>

    </main>

    <script>

        // 입력 요소 가져오기
        const form = document.getElementById("readingForm");

        const bookTitleInput =
            document.getElementById("bookTitle");

        const readingMinutesInput =
            document.getElementById("readingMinutes");

        const reviewInput =
            document.getElementById("review");

        const reviewCount =
            document.getElementById("reviewCount");


        // 실시간 글자 수 표시 함수
        function updateReviewCount() {

            // 현재 입력된 글자 수 계산
            const currentLength = reviewInput.value.length;

            // 현재 글자 수 / 100 표시
            reviewCount.textContent =
                currentLength + " / 100";

        }


        // 감상 내용을 입력할 때마다 글자 수 갱신
        reviewInput.addEventListener(
            "input",
            updateReviewCount
        );


        // 처음 화면이 열렸을 때 글자 수 표시
        updateReviewCount();


        // 기록 저장 버튼을 눌렀을 때 실행
        form.addEventListener("submit", function(event) {

            // 오류 메시지를 저장할 배열
            const errors = [];

            // 첫 번째 오류 입력 요소
            let firstErrorInput = null;


            // 1. 책 제목 검사
            if (bookTitleInput.value.trim() === "") {

                errors.push("책 제목을 입력해 주세요.");

                firstErrorInput =
                    firstErrorInput || bookTitleInput;

            }


            // 2. 독서 시간 검사
            const readingMinutesText =
                readingMinutesInput.value.trim();

            if (readingMinutesText === "") {

                errors.push("독서 시간을 입력해 주세요.");

                firstErrorInput =
                    firstErrorInput || readingMinutesInput;

            } else {

                const readingMinutes =
                    Number(readingMinutesText);

                if (
                    !Number.isInteger(readingMinutes) ||
                    readingMinutes < 1 ||
                    readingMinutes > 180
                ) {

                    errors.push(
                        "독서 시간은 1~180 사이의 정수로 입력해 주세요."
                    );

                    firstErrorInput =
                        firstErrorInput || readingMinutesInput;

                }

            }


            // 3. 한 줄 감상 검사
            const reviewText = reviewInput.value;

            const reviewLength = reviewText.length;


            // 한 줄 감상이 공란인지 검사
            if (reviewText.trim() === "") {

                errors.push("한 줄 감상을 입력해 주세요.");

                firstErrorInput =
                    firstErrorInput || reviewInput;

            } else {

                // 최소 글자 수 검사
                if (reviewLength < 10) {

                    errors.push(
                        "한 줄 감상은 최소 10자 이상 입력해 주세요."
                    );

                    firstErrorInput =
                        firstErrorInput || reviewInput;

                }

                // 최대 글자 수 검사
                if (reviewLength > 100) {

                    errors.push(
                        "한 줄 감상은 최대 100자까지만 입력할 수 있습니다."
                    );

                    firstErrorInput =
                        firstErrorInput || reviewInput;

                }

            }


            // 오류가 하나라도 있다면
            if (errors.length > 0) {

                // 폼 제출 중단
                event.preventDefault();

                // 오류 안내창 표시
                alert(
                    "다음 항목을 확인해 주세요.\n\n" +
                    errors.join("\n")
                );

                // 첫 번째 오류 항목으로 커서 이동
                firstErrorInput.focus();

            }

        });

    </script>

</body>
</html>
